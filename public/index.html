<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shelf Check — compare beauty products</title>
<meta name="description" content="Compare makeup and skincare: ingredients, toxicity flags, cruelty-free, price and reviews. Scan screenshots or paste links from any shop.">
<meta name="theme-color" content="#a8475e">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f2;--card:#fff;--ink:#2b2320;--muted:#7d706a;--line:#ece2da;
  --rose:#a8475e;--rose-soft:#f6e3e7;--on-rose:#fff;
  --high:#b83227;--high-bg:#fce7e4;--mod:#a86a08;--mod-bg:#fcf0d9;
  --low:#62666e;--low-bg:#efeff1;--good:#2a7454;--good-bg:#e1f2e8;
  --eco:#2c6886;--eco-bg:#e0eef5;--animal:#74539f;--animal-bg:#eee6f7;
  --surface2:#fbf8f5;--soft:#f7f3ef;--seg:#f3ece6;--track:#eee6df;--border2:#cdbfb5;--header:rgba(250,246,242,.92);
  --neutral-ink:#5d524d;--best-bg:#f1f9f4;--warn-ink:#7a4d05;--grab:#d9cdc4;--sw:#ddd2ca;--star-off:#dccfc6;--dot:#d8d0ca;
  --star-bg:#fdf3d6;--star-ink:#8a6200;--shadow:rgba(0,0,0,.08);--overlay:rgba(43,35,32,.38);
  --r:16px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#151214;--card:#211c1f;--ink:#f1e9e6;--muted:#ab9e99;--line:#362e32;
  --rose:#e8869d;--rose-soft:#3b2229;--on-rose:#1c1015;
  --high:#ff8f80;--high-bg:#3d201d;--mod:#f2b955;--mod-bg:#3b2d15;
  --low:#bcc0c7;--low-bg:#2b282c;--good:#74d6a4;--good-bg:#163129;--eco:#82c4e6;--eco-bg:#172a3b;--animal:#c6a9ee;--animal-bg:#2c2339;
  --surface2:#1c181a;--soft:#2b2528;--seg:#2b2528;--track:#3b3337;--border2:#5c5055;--header:rgba(21,18,20,.9);
  --neutral-ink:#d8cdc8;--best-bg:#163129;--warn-ink:#f4cb7e;--grab:#4b4146;--sw:#4b4146;--star-off:#4b4146;--dot:#5c5055;
  --star-bg:#3b2f12;--star-ink:#f2c95a;--shadow:rgba(0,0,0,.4);--overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em}
header{position:sticky;top:0;z-index:5;background:var(--header);backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:22px}
header h1 span{color:var(--rose)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
.lede{color:var(--muted);margin:2px 0 14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--muted);border-radius:12px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--rose);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:500}
.btn.primary{background:var(--rose);color:var(--on-rose);border-color:var(--rose)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--high)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pcard{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.pcard .meta{flex:1;min-width:0}
.pcard .name{font-weight:600;line-height:1.25}
.pcard .sub{color:var(--muted);font-size:13px}
.ring{--v:0;--c:var(--good);width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--v)*1%),var(--track) 0)}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--low-bg);color:var(--low);white-space:nowrap}
.chip.high{background:var(--high-bg);color:var(--high)}
.chip.mod{background:var(--mod-bg);color:var(--mod)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.eco{background:var(--eco-bg);color:var(--eco)}
.chip.animal{background:var(--animal-bg);color:var(--animal)}
.chip.neutral{background:var(--soft);color:var(--neutral-ink)}
.chip.rose{background:var(--rose-soft);color:var(--rose)}
button.chip{cursor:pointer}
.selbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border2);flex:none;display:grid;place-items:center;margin-top:2px}
.selbox.on{background:var(--rose);border-color:var(--rose)}
.selbox.on::after{content:"";width:9px;height:5px;border:2px solid var(--on-rose);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 8px;font-weight:600;font-family:inherit}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
textarea,input[type=text],input[type=number],input[type=url],input[type=search],select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px}
textarea{min-height:120px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.summary b{display:block;font-size:20px;font-family:Fraunces,serif}
.summary small{font-size:11.5px;color:var(--muted)}
/* compare */
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);-webkit-overflow-scrolling:touch}
table.cmp{border-collapse:separate;border-spacing:0;min-width:100%}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:14px;min-width:150px}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.cmp th.rl{position:sticky;left:0;background:var(--surface2);font-weight:500;color:var(--muted);font-size:12.5px;min-width:104px;max-width:110px;z-index:1}
.cmp thead td{font-weight:600;background:var(--card)}
.cmp td.best{background:var(--best-bg)}
.cmp td.best::after{content:" ★";color:var(--good);font-size:12px}
.yes{color:var(--good);font-weight:600}.no{color:var(--high);font-weight:600}.unk{color:var(--muted)}
/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:86vh}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--grab);margin:4px auto 12px}
.sheet h2{font-size:22px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.warn{background:var(--mod-bg);color:var(--warn-ink);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.reason{font-size:13px;color:var(--muted);margin-top:6px}
.rank{font-family:Fraunces,serif;font-size:20px;color:var(--rose);width:24px;flex:none}
.ingline{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ingline:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--dot)}
.dot.high{background:var(--high)}.dot.mod{background:var(--mod)}.dot.low{background:#a2a6ad}.dot.good{background:var(--good)}.dot.eco{background:var(--eco)}.dot.animal{background:var(--animal)}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{width:42px;height:25px;border-radius:99px;background:var(--sw);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--rose)}.sw.on::after{left:20px}
a{color:var(--rose)}
.scanhero{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:22px 14px;border-radius:var(--r);
  background:linear-gradient(135deg,#a8475e,#c86b7f);color:#fff;text-align:center;cursor:pointer;margin-bottom:14px}
.scanhero b{font-family:Fraunces,serif;font-size:20px;font-weight:650}
.scanhero span{font-size:13px;opacity:.9}
.scanhero svg{width:34px;height:34px}
.linkbox{display:flex;gap:8px;margin:-4px 0 14px}.linkbox input{flex:1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--rose-soft);border-top-color:var(--rose);animation:sp 0.8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.stars{display:flex;gap:2px}
.stars button{font-size:26px;line-height:1;color:var(--star-off);padding:2px}
.stars button.on{color:#e0a106}
.bar{height:8px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pc ul{padding-left:16px;font-size:13.5px;display:grid;gap:3px}
.pc h4{font-size:12.5px;font-family:inherit;font-weight:600;margin-bottom:4px}
html.i18n-wait body{visibility:hidden}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
[dir=rtl] *{letter-spacing:0!important}
[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .sheet h2,[dir=rtl] .scanhero b{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:700}
[dir=rtl] [style*="text-align:left"],[dir=rtl] .pcard,[dir=rtl] .cmp th,[dir=rtl] .cmp td{text-align:right!important}
[dir=rtl] .cmp th.rl{left:auto;right:0}
[dir=rtl] ul{padding-left:0!important;padding-right:18px}
[dir=rtl] .sw::after{left:auto;right:3px}[dir=rtl] .sw.on::after{right:20px;left:auto}
[dir=rtl] .cmp td.best::after{content:" ★"}
[dir=rtl] .linkbox input,[dir=rtl] input[type=url]{direction:ltr;text-align:right}
@media print{
  :root{color-scheme:light}
  header .iconbtn,nav,.overlay,.toast,.btn,.selbox,.scanhero,.linkbox{display:none!important}
  body,html{background:#fff}main{padding:0;max-width:none}
  .view{display:none!important}#v-compare{display:block!important}
  .cmp-wrap{overflow:visible;border:0}.cmp th.rl{position:static}
  .card{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1 translate="no">Shelf <span>Check</span></h1>
  <div class="row" style="gap:6px;flex-wrap:nowrap">
  <button class="iconbtn" data-a="theme" aria-label="Night mode" id="themebtn"></button>
  <button class="iconbtn" data-a="profile" aria-label="My profile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  <button class="iconbtn" data-a="settings" aria-label="Settings & data">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  </div>
</header>

<main>
  <section class="view" id="v-shelf"></section>
  <section class="view" id="v-compare"></section>
  <section class="view" id="v-scan"></section>
  <section class="view" id="v-suggest"></section>
</main>

<nav>
  <button data-tab="shelf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 12h18M8 4v8M15 12v8"/></svg>Shelf</button>
  <button data-tab="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></svg>Compare</button>

</nav>

<script>
/* ============ INGREDIENT KNOWLEDGE BASE ============
   l = level: high | mod | low | eco | animal | good
   t = tags used for filters                          */
const DB = [
 {n:'Formaldehyde',r:/formaldehyde|formalin|methylene glycol/,l:'high',t:['formaldehyde'],w:'Classified as a known human carcinogen and a strong skin sensitiser. Banned in EU cosmetics; still found in some nail and hair-smoothing products.'},
 {n:'Formaldehyde-releasing preservative',r:/dmdm hydantoin|imidazolidinyl urea|diazolidinyl urea|quaternium-15|bronopol|2-bromo-2-nitropropane|hydroxymethylglycinate/,l:'high',t:['formaldehyde'],w:'Preservatives that slowly release small amounts of formaldehyde over time. Common cause of contact allergy.'},
 {n:'Restricted paraben',r:/isopropylparaben|isobutylparaben|benzylparaben|pentylparaben|phenylparaben/,l:'high',t:['paraben'],w:'Banned in the EU since 2014 because there wasn\'t enough data to show they are safe.'},
 {n:'Long-chain paraben',r:/propylparaben|butylparaben/,l:'mod',t:['paraben'],w:'Allowed at low levels (EU max 0.14%). Show weak hormone-like activity in lab studies, so many people choose to avoid them.'},
 {n:'Short-chain paraben',r:/methylparaben|ethylparaben/,l:'low',t:['paraben'],w:'Regulators consider these safe at permitted levels. Lowest concern of the parabens; flagged in case you prefer paraben-free.'},
 {n:'Phthalate',r:/phthalate|\bdbp\b|\bdehp\b/,l:'high',t:['phthalate'],w:'Linked to hormone disruption. Several are banned in EU cosmetics. Can hide inside "fragrance" in some countries.'},
 {n:'Triclosan / triclocarban',r:/triclosan|triclocarban/,l:'high',t:[],w:'Antibacterial agent with hormone-disruption and antibiotic-resistance concerns. Restricted in the EU and US.'},
 {n:'PFAS ("forever chemical")',r:/ptfe|polytetrafluoroethylene|perfluoro|polyfluoro|fluoroalcohol|fluoroalkyl/,l:'high',t:['pfas'],w:'Per- and polyfluorinated substances persist in the body and environment for a very long time. Often in long-wear or waterproof makeup. Several US states are phasing them out of cosmetics.'},
 {n:'Hydroquinone',r:/hydroquinone/,l:'high',t:[],w:'Skin-lightening agent. Banned in EU cosmetics and prescription-only in many countries due to irritation and ochronosis risk.'},
 {n:'Mercury compound',r:/mercury|mercuric|thimerosal|calomel/,l:'high',t:[],w:'Toxic heavy metal sometimes found in illegal skin-lightening creams. Avoid entirely.'},
 {n:'Lead compound',r:/lead acetate/,l:'high',t:[],w:'Toxic heavy metal; banned in EU cosmetics.'},
 {n:'Coal tar / PPD',r:/coal tar|p-phenylenediamine|\bppd\b/,l:'high',t:[],w:'Found in some dark hair dyes. Strong sensitiser; coal tar is a known carcinogen.'},
 {n:'Toluene',r:/toluene/,l:'high',t:[],w:'Solvent in some nail polishes. Neurotoxic at high exposure; part of the "toxic trio" in nail products.'},
 {n:'Lilial',r:/butylphenyl methylpropional|lilial/,l:'high',t:['fragrance'],w:'Fragrance ingredient banned in the EU since 2022 (reproductive toxicity).'},
 {n:'Butylated hydroxyanisole (BHA)',r:/butylated hydroxyanisole/,l:'high',t:[],w:'Antioxidant preservative listed as a possible human carcinogen (IARC 2B).'},
 {n:'Isothiazolinone preservative',r:/methylisothiazolinone|methylchloroisothiazolinone/,l:'high',t:[],w:'Very common cause of contact allergy. Banned in EU leave-on products.'},
 {n:'Cyclic silicone D4',r:/cyclotetrasiloxane|\bd4\b/,l:'high',t:['silicone'],w:'Suspected hormone disruptor and persistent in the environment. Restricted in the EU.'},
 {n:'Cyclic silicone D5/D6',r:/cyclopentasiloxane|cyclohexasiloxane|cyclomethicone/,l:'mod',t:['silicone'],w:'Persists in the environment; the EU is restricting these in wash-off and leave-on products.'},
 {n:'Oxybenzone',r:/oxybenzone|benzophenone-3/,l:'mod',t:['chemuv','reef'],w:'Chemical UV filter. Absorbed through skin, possible hormone effects, and linked to coral reef damage (banned in Hawaii and some other places).'},
 {n:'Chemical UV filter',r:/homosalate|octinoxate|ethylhexyl methoxycinnamate|octisalate|ethylhexyl salicylate/,l:'mod',t:['chemuv'],w:'Absorbed through skin; some show hormone-like activity in studies. The EU has lowered limits for homosalate.'},

function split(text){
  text=(text||'').replace(/^\s*(ingredients|ingrédients|inci)\s*[:\-]/i,'').replace(/\[\s*\+\/-.*?\]/g,m=>','+m.replace(/[\[\]]|\+\/-|may contain:?/gi,'')+',').replace(/(\+\/-|may contain:?)/gi,',');

  for(const ch of text){
    if(ch==='('||ch==='[')d++; if(ch===')'||ch===']')d=Math.max(0,d-1);
    if(d===0&&/[,;\n•·|]/.test(ch)){out.push(cur);cur='';}else cur+=ch;
  }
  out.push(cur);
  return out.map(s=>s.trim().replace(/\.$/,'').replace(/\s+/g,' ')).filter(s=>s.length>1);
}

const AVOID_GROUPS=[
 ['tag:fragrance','Fragrance & scent allergens'],['tag:paraben','Parabens'],['tag:sulfate','Sulfates'],['tag:silicone','Silicones'],
 ['re:alcohol','Drying alcohol'],['re:essential','Essential oils'],['tag:animal','Animal-derived'],['re:nuts','Nut oils'],
 ['re:coconut','Coconut-derived'],['re:gluten','Wheat / gluten'],['tag:formaldehyde','Formaldehyde releasers'],
 ['tag:chemuv','Chemical sunscreens'],['tag:microplastic','Microplastics'],['tag:pfas','PFAS'],['tag:dye','Synthetic dyes'],
];
const AVOID_RE={
 alcohol:/alcohol denat|sd alcohol|^alcohol$|^ethanol$/,
 essential:/lavandula|mentha|eucalyptus|rosmarinus|melaleuca|citrus .*oil|bergamot|ylang|geranium|tea tree|peppermint|eugenia|cinnamomum/,
 nuts:/prunus amygdalus|almond|argania|argan|macadamia|juglans|walnut|corylus|hazelnut|pistachio|cashew|anacardium|bertholletia/,
 coconut:/cocos nucifera|coconut|\bcoco-|cocamid|cocoyl|coco glucoside|cocoglucoside|cocamidopropyl/,
 gluten:/triticum|wheat|hordeum|secale|hydrolyzed wheat/,
};
const avoidLabel=k=>(AVOID_GROUPS.find(g=>g[0]===k)||[k,k.replace(/^txt:/,'')])[1];
function avoidHits(a){
  const out=[]; const items=S.avoid||[];
  if(!items.length||!a.n) return out;
  for(const k of items){
    let m=[];
    if(k.startsWith('tag:')) m=a.list.filter(i=>i.h.some(e=>e.t.includes(k.slice(4))));
    else if(k.startsWith('re:')&&AVOID_RE[k.slice(3)]) m=a.list.filter(i=>AVOID_RE[k.slice(3)].test(i.name.toLowerCase()));
    else if(k.startsWith('txt:')){const q=k.slice(4).toLowerCase().trim(); if(q.length>1) m=a.list.filter(i=>i.name.toLowerCase().includes(q));}
    if(m.length) out.push({k,label:avoidLabel(k),items:m});
  }
  return out;
}
function hasProfile(){const k=S.skin||{};return !!(k.type||k.sensitive||k.acne)}
function skinFit(a){
  if(!hasProfile()||!a.n) return null;
  const k=S.skin, who=new Set(); if(k.type==='dry')who.add('dry'); if(k.type==='oily')who.add('oily'); if(k.type==='combination'){who.add('oily');}
  if(k.sensitive)who.add('sensitive'); if(k.acne)who.add('acne');
  const bad=[],good=[];
  a.list.forEach(i=>{const n=i.name.toLowerCase();SKIN_RULES.forEach(([w,isBad,re,lab,why])=>{if(who.has(w)&&re.test(n)){(isBad?bad:good).push({name:i.name,lab,why,w})}})});
  const uniq=arr=>{const s=new Set();return arr.filter(x=>{const key=x.name+'|'+x.lab;if(s.has(key))return false;s.add(key);return true})};
  const merge=arr=>{const m=new Map();arr.forEach(x=>{const e=m.get(x.name);if(e){if(!e.lab.includes(x.lab))e.lab+=', '+x.lab.toLowerCase();if(!e.why.includes(x.why))e.why+=' '+x.why}else m.set(x.name,{...x})});return [...m.values()]};
  const B=merge(uniq(bad)),G=merge(uniq(good));
  const pen=B.reduce((t,x)=>t+(x.w==='sensitive'&&/Fragrance|allergen/.test(x.lab)?18:12),0);
  const score=Math.max(0,Math.min(100,Math.round(80+Math.min(20,new Set(G.map(g=>g.name)).size*5)-pen)));
  return {score,bad:B,good:G,label:score>=75?'Great fit':score>=55?'Okay fit':'Not ideal'};
}
function profileSummary(){
  const k=S.skin||{};const parts=[];
  if(k.type)parts.push({dry:'Dry',oily:'Oily',combination:'Combination',normal:'Normal'}[k.type]+' skin');
  if(k.sensitive)parts.push('Sensitive');if(k.acne)parts.push('Acne-prone');
  return parts.join(' · ');
}

/* ============ DUPE FINDER ============ */
const normIng=n=>n.toLowerCase().replace(/\(.*?\)|\[.*?\]/g,'').replace(/\s+/g,' ').trim();
const _sig=new Map();
function ingSig(p){
  const key=p.ing||''; if(_sig.has(key)) return _sig.get(key);
  const m=new Map(); split(key).forEach((n,i)=>{const k=normIng(n); if(!k||/^(aqua|water|eau)\b/.test(k)||m.has(k)) return; m.set(k,1/(1+i*0.15));});
  if(_sig.size>800)_sig.clear(); _sig.set(key,m); return m;
}
function similarity(a,b){
  const A=ingSig(a),B=ingSig(b); if(A.size<4||B.size<4) return 0;
  let inter=0,uni=0; const keys=new Set([...A.keys(),...B.keys()]);
  keys.forEach(k=>{const x=A.get(k)||0,y=B.get(k)||0; inter+=Math.min(x,y); uni+=Math.max(x,y);});
  return uni?inter/uni:0;
}
function findDupes(p,limit=3){
  return S.products.filter(o=>o.id!==p.id&&!(o.demo&&!p.demo&&false)).map(o=>({o,sim:similarity(p,o)}))
    .filter(x=>x.sim>=0.45).sort((a,b)=>b.sim-a.sim).slice(0,limit);
}
function dupesHTML(f){
  const d=findDupes(f.p); if(!d.length) return '';
  return `<div class="section-title">Similar formulas on your shelf</div><div style="display:grid;gap:8px">${d.map(({o,sim})=>{
    const v2=per10(o); const save=f.v&&v2&&v2<f.v?Math.round((1-v2/f.v)*100):0;
    return `<button class="card pcard" data-a="open" data-id="${o.id}"><span class="meta"><span class="name" translate="no" style="display:block">${esc(o.name)}</span><span class="sub" style="display:block">${esc(o.brand||'')}${o.brand?' · ':''}${priceLabel(o)}</span><span class="chips"><span class="chip ${sim>=0.6?'rose':'neutral'}">${Math.round(sim*100)}% same ingredients</span>${save>=10?`<span class="chip good">💸 ${save}% cheaper per ${esc(o.unit)}</span>`:''}</span></span></button>`}).join('')}</div>`;
}
function cheapDupes(all){
  const out=[];
  all.forEach(f=>{ if(!f.v) return; findDupes(f.p,5).forEach(({o,sim})=>{const v2=per10(o); if(v2&&v2<f.v*0.85&&sim>=0.5) out.push({f,o,sim,save:Math.round((1-v2/f.v)*100)});}); });
  const seen=new Set(); return out.sort((a,b)=>b.save-a.save).filter(x=>{const k=x.f.p.id;if(seen.has(k))return false;seen.add(k);return true}).slice(0,5);
}

let shelfQuery='';
const SORTS=[['new','Newest'],['safety','Safest'],['forme','Best for me'],['value','Cheapest per ml/g'],['reviews','Best reviewed'],['name','Name A–Z']];
function sortShelf(items){
  const k=S.sort||'new'; const by=fn=>items.slice().sort(fn);
  if(k==='safety') return by((a,b)=>(b.a.safety??-1)-(a.a.safety??-1));
  if(k==='forme') return by((a,b)=>((b.fit?b.fit.score:-1)-(b.av.length?100:0))-((a.fit?a.fit.score:-1)-(a.av.length?100:0)));
  if(k==='value') return by((a,b)=>(a.v??1e12)-(b.v??1e12));
  if(k==='reviews') return by((a,b)=>(b.r?b.r.score:-1)-(a.r?a.r.score:-1));
  if(k==='name') return by((a,b)=>a.p.name.localeCompare(b.p.name));
  return items;
}
function matchQuery(p,q){ if(!q) return true; q=q.toLowerCase(); return [p.name,p.brand,p.category,p.ing].some(x=>String(x||'').toLowerCase().includes(q)); }

    ['Plastics & PFAS',f=>{const l=[...f.a.by.eco.filter(i=>i.h.some(e=>e.t.includes('microplastic'))),...f.a.list.filter(i=>i.h.some(e=>e.t.includes('pfas')))];return l.length?`<div class="chips" style="margin:0">${l.map(ingChip).join('')}</div>`:'<span class="yes">None</span>'}],
    ['Fragrance',f=>f.a.tags.has('fragrance')?'<span class="no">Contains</span>':'<span class="yes">Free</span>'],
    ['Good stuff',f=>f.a.by.good.length?`<div class="chips" style="margin:0">${f.a.by.good.map(ingChip).join('')}</div>`:'<span class="unk">—</span>'],
    ['Ingredients',f=>f.a.n,f=>f.a.n,'min'],
  ];
  const best=(get,dir)=>{const vals=fs.map(get).filter(v=>v!=null&&!isNaN(v));if(vals.length<2)return null;const b=dir==='min'?Math.min(...vals):Math.max(...vals);return vals.filter(v=>v===b).length===vals.length?null:b};
  const sets=fs.map(f=>new Set(f.a.list.map(i=>i.name.toLowerCase())));
  const shared=[...sets[0]].filter(n=>sets.every(s=>s.has(n)));
  // verdict

  const safest=pick(f=>f.a.safety??-1), ethic=pick(f=>f.e.score), cheap=fs.filter(f=>f.v).sort((a,b)=>a.v-b.v)[0];
  el.innerHTML=`<div class="row"><h2 style="font-size:24px">Compare</h2><span class="spacer"></span><button class="btn small" data-a="sharecmp">Share</button><button class="btn small" data-a="clearsel">Clear</button></div>

  <div class="card" style="margin-bottom:12px">
    <div class="sub" style="color:var(--muted);font-size:13px;margin-bottom:6px">Quick verdict</div>
    <div>🛡️ <b>Safest formula:</b> ${esc(safest.p.name)}</div>
    <div>🌿 <b>Most ethical:</b> ${esc(ethic.p.name)}</div>
    ${(()=>{const rv=fs.filter(f=>f.r);if(!rv.length)return '';const b=rv.reduce((a,c)=>c.r.score>a.r.score?c:a);return `<div>💬 <b>Best reviewed:</b> ${esc(b.p.name)} (${b.r.score})</div>`})()}
    ${cheap?`<div>💸 <b>Best value:</b> ${esc(cheap.p.name)} (${money(cheap.v)}/10${esc(cheap.p.unit)})</div>`:''}
    ${fs.some(f=>f.p.price>0&&(f.p.cur||S.currency)!==S.currency)?`<div class="note" style="margin-top:8px">Prices shown in ${esc(S.currency)}, converted at today's exchange rate.</div>`:''}
    ${units.size>1?'<div class="warn">These are sold in different units (ml and g), so the price per 10 is only a rough comparison.</div>':''}
  </div>
  <div class="cmp-wrap"><table class="cmp">
    <thead><tr><th class="rl"></th>${fs.map(f=>`<td><div translate="no">${esc(f.p.name)}</div><div class="sub" style="font-weight:400;color:var(--muted);font-size:12.5px">${esc(f.p.brand||'')}</div><button class="btn small" style="margin-top:6px" data-a="sel" data-id="${f.p.id}">Remove</button></td>`).join('')}</tr></thead>
    <tbody>${rows.map(([lab,show,get,dir])=>{const b=get?best(get,dir):null;return `<tr><th class="rl">${lab}</th>${fs.map(f=>`<td class="${b!=null&&get(f)===b?'best':''}">${show(f)}</td>`).join('')}</tr>`}).join('')}</tbody>
  </table></div>
  <div class="section-title">In all of them (${shared.length})</div>
  <div class="card">${shared.length?`<div class="chips" style="margin:0">${shared.map(n=>{const i=fs[0].a.list.find(x=>x.name.toLowerCase()===n);return ingChip(i)}).join('')}</div>`:'<span class="sub" style="color:var(--muted)">No ingredients in common.</span>'}</div>
  ${fs.map((f,k)=>{const u=f.a.list.filter(i=>!sets.some((s,j)=>j!==k&&s.has(i.name.toLowerCase())));return `<div class="section-title">Only in ${esc(f.p.name)} (${u.length})</div><div class="card"><div class="chips" style="margin:0">${u.map(ingChip).join('')||'<span class="sub">—</span>'}</div></div>`}).join('')}`;
}

function avoidSet(a){return new Set(avoidHits(a).flatMap(h=>h.items))}
function analysisHTML(a){
  if(!a.n) return '';
  const [g,c]=grade(a.safety);
  const tips=[...a.tags].filter(t=>ALT[t]).map(t=>`<li>${ALT[t]}</li>`).join('');
  return `
  <div class="card" style="margin-top:12px;display:flex;gap:14px;align-items:center">${ring(a.safety,62)}<div><div style="font-family:Fraunces,serif;font-size:20px;color:${c}">${g}</div><div class="sub" style="color:var(--muted);font-size:13px">Ingredient safety score · ${a.n} ingredients</div></div></div>
  <div class="summary">
    <div><b style="color:var(--high)">${a.by.high.length}</b><small>High</small></div>
    <div><b style="color:var(--mod)">${a.by.mod.length}</b><small>Moderate</small></div>
    <div><b style="color:var(--eco)">${a.by.eco.length}</b><small>Eco</small></div>
    <div><b style="color:var(--good)">${a.by.good.length}</b><small>Beneficial</small></div>
  </div>
  ${a.tags.has('animal')?`<div class="warn" style="background:var(--animal-bg);color:var(--animal)">Possibly not vegan: ${a.by.animal.map(i=>esc(i.name)).join(', ')}</div>`:''}
  ${tips?`<div class="section-title">Swap ideas</div><div class="card"><ul style="padding-left:18px;display:grid;gap:6px;font-size:14px">${tips}</ul></div>`:''}
  <div class="section-title">Every ingredient, in label order</div>
  <div class="card" style="padding:4px 14px">${a.list.map(i=>`<button class="ingline" style="width:100%;text-align:left" data-a="ing" data-n="${esc(i.name)}"><span class="dot ${i.lv}"></span><span style="flex:1"><span style="font-weight:500" translate="no">${esc(i.name)}</span>${i.h.length?`<br><span style="font-size:12.5px;color:var(--muted)">${i.h.map(e=>e.n).join(' · ')}</span>`:''}</span>${avoidSet(a).has(i)?'<span class="chip high" style="font-size:11px">You avoid</span>':`<span class="chip ${i.lv}" style="font-size:11px">${LV_LABEL[i.lv]}</span>`}</button>`).join('')}</div>
  <p class="note">Ingredients near the top of the list are present in the highest amounts. A flag means an ingredient has a known concern, not that the product is unsafe. How much is in it, how often you use it, and whether it stays on your skin all matter. This is not medical advice.</p>`;
}
function renderScanOut(){
  const a=analyze(scanText);
  const av=avoidHits(a);
  document.getElementById('scanout').innerHTML=a.n?(av.length?`<div class="warn" style="background:var(--high-bg);color:var(--high);margin-top:12px"><b>⚠ Contains ingredients you avoid</b><br>${av.map(h=>`${esc(h.label)}: <span translate="no">${h.items.map(i=>esc(i.name)).join(', ')}</span>`).join('<br>')}</div>`:'')+(skinFit(a)?forYouHTML({a,fit:skinFit(a),av:[]}):'')+analysisHTML(a):`<div class="card" style="margin-top:12px"><div class="sub" style="color:var(--muted);margin-bottom:8px">How flags work</div><div class="legend">${['high','mod','low','eco','animal','good'].map(l=>`<span class="chip ${l}">${LV_LABEL[l]}</span>`).join('')}</div><p style="font-size:14px">Shelf Check knows ${DB.length} ingredient groups: preservatives, fragrance, UV filters, PFAS, microplastics, animal-derived ingredients and more.</p></div>`;
}

function renderSuggest(){
  const el=document.getElementById('v-suggest'); const P=S.prefs;
  const T=(k,label,sub)=>`<div class="toggle"><div style="flex:1"><div style="font-weight:500">${label}</div>${sub?`<div style="font-size:12.5px;color:var(--muted)">${sub}</div>`:''}</div><button class="sw ${P[k]?'on':''}" data-a="pref" data-k="${k}" aria-label="${label}"></button></div>`;
  const all=S.products.map(full);
  const reasons=f=>{const r=[];const p=f.p,a=f.a;
    if(P.cat!=='Any'&&p.category!==P.cat)r.push('different category');
    if(P.cf&&p.cf!=='yes')r.push(p.cf==='no'?'not cruelty-free':'cruelty-free unknown');
    if(P.vegan&&(p.vegan!=='yes'||a.tags.has('animal')))r.push('not confirmed vegan');
    if(P.plastic&&p.plastic!=='yes')r.push('plastic packaging');
    if(P.nofrag&&a.tags.has('fragrance'))r.push('contains fragrance');
    if(P.nopar&&a.tags.has('paraben'))r.push('contains parabens');
    if(P.nomicro&&(a.tags.has('microplastic')||a.tags.has('pfas')))r.push('microplastics/PFAS');
    if(P.nohigh&&a.by.high.length)r.push(a.by.high.length+' high-concern ingredient'+(a.by.high.length>1?'s':''));
    if(P.budget&&priceOf(p)>+P.budget)r.push('over budget');
    if(P.noavoid!==false&&f.av&&f.av.length)r.push('has '+f.av.map(h=>h.label.toLowerCase()).join(', '));
    return r};
  const vs=all.filter(f=>f.v).map(f=>f.v); const vmin=Math.min(...vs);
  const valScore=f=>f.v?Math.round(vmin/f.v*100):40;
  const score=f=>{const s=f.a.safety??50,e=f.e.score,v=valScore(f),r=f.r?f.r.score:50,m=f.fit?f.fit.score:null;
    if(P.mode==='forme')return m!=null?m*.55+s*.25+r*.1+e*.1:s*.6+r*.2+e*.2;
    if(P.mode==='safest')return s*.75+e*.1+v*.05+r*.1;
    if(P.mode==='ethical')return e*.65+s*.2+v*.05+r*.1;
    if(P.mode==='value')return v*.6+s*.15+e*.1+r*.15;
    if(P.mode==='reviews')return r*.7+s*.2+e*.1;
    return m!=null?s*.3+e*.2+v*.1+r*.2+m*.2:s*.35+e*.25+v*.15+r*.25};
  const pass=all.filter(f=>!reasons(f).length).sort((a,b)=>score(b)-score(a));
  const fail=all.filter(f=>reasons(f).length&&(P.cat==='Any'||f.p.category===P.cat));
  const why=f=>{const w=[];if(f.fit&&f.fit.score>=75)w.push('suits your skin');if(f.a.safety>=80)w.push('clean formula');if(f.p.cf==='yes')w.push('cruelty-free');if(f.p.plastic==='yes')w.push('plastic-free pack');if(f.v&&f.v===vmin)w.push('best price per '+f.p.unit);if(f.r&&f.r.score>=75)w.push('well reviewed ('+f.r.score+')');if(f.r&&f.r.cons.length&&f.r.score<60)w.push('note: '+f.r.cons[0]);if(f.a.by.good.length)w.push(f.a.by.good.slice(0,2).map(i=>i.h.find(e=>e.l==='good').n.toLowerCase()).join(' + '));return w.join(' · ')||'meets your filters'};
  // swaps: products scoring low with a better one in same category
  const swaps=all.filter(f=>(f.a.safety??100)<60).map(f=>{const alt=all.filter(o=>o.p.id!==f.p.id&&o.p.category===f.p.category&&(o.a.safety??0)>(f.a.safety??0)+15).sort((a,b)=>score(b)-score(a))[0];return alt?{f,alt}:null}).filter(Boolean);
  el.innerHTML=`<h2 style="font-size:24px">Suggest</h2><p class="lede">Tell it what matters to you. It ranks what's on your shelf and suggests better swaps.</p>
  <div class="card" style="padding:4px 14px">
    ${T('cf','Cruelty-free only')}${T('vegan','Vegan only','Also checks the ingredients for animal-derived ones')}
    ${T('plastic','Plastic-free packaging')}${T('nofrag','Fragrance-free','Good for sensitive skin')}
    ${T('nopar','No parabens')}${T('nomicro','No microplastics or PFAS')}${T('nohigh','No high-concern ingredients')}${(S.avoid||[]).length?`<div class="toggle"><div style="flex:1"><div style="font-weight:500">Skip my avoid list</div><div style="font-size:12.5px;color:var(--muted)">${esc((S.avoid||[]).map(avoidLabel).join(', '))}</div></div><button class="sw ${P.noavoid!==false?'on':''}" data-a="pref" data-k="noavoid" aria-label="Skip my avoid list"></button></div>`:''}
  </div>
  <div class="grid2" style="margin-top:10px">
    <div><label class="f">Category</label><select data-a="prefsel" data-k="cat">${['Any',...cats()].map(c=>`<option value="${esc(c)}" ${c===P.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div><label class="f">Max price (${esc(S.currency)})</label><input type="number" inputmode="decimal" data-a="prefsel" data-k="budget" value="${esc(P.budget)}" placeholder="No limit"></div>
  </div>
  <label class="f">Rank by</label>
  <div class="seg">${[['balanced','Balanced'],...(hasProfile()?[['forme','For me']]:[]),['safest','Safest'],['ethical','Ethical'],['reviews','Reviews'],['value','Value']].map(([k,l])=>`<button class="${P.mode===k?'on':''}" data-a="mode" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="section-title">Top picks (${pass.length})</div>
  ${pass.length?`<div style="display:grid;gap:8px">${pass.map((f,i)=>`<button class="card pcard" data-a="open" data-id="${f.p.id}"><span class="rank">${i+1}</span><span class="meta"><span class="name" translate="no" style="display:block">${esc(f.p.name)}</span><span class="sub" style="display:block">${esc(f.p.category||'')} · ${priceLabel(f.p)}</span><span class="reason" style="display:block">✓ ${esc(why(f))}</span></span>${ring(f.a.safety,46)}</button>`).join('')}</div>`:'<div class="card empty">Nothing on your shelf matches every filter. Try turning one off, or add more products.</div>'}
  ${(()=>{const cd=cheapDupes(all);return cd.length?`<div class="section-title">Cheaper dupes</div><div style="display:grid;gap:8px">${cd.map(({f,o,sim,save})=>`<div class="card"><div class="sub" style="color:var(--muted);font-size:13px">Instead of</div><div style="font-weight:600">${esc(f.p.name)}</div><div class="sub" style="color:var(--muted);font-size:13px;margin-top:6px">Try (${Math.round(sim*100)}% same ingredients)</div><button style="font-weight:600;text-align:left" data-a="open" data-id="${o.id}">${esc(o.name)} <span class="chip good" style="margin-left:4px">💸 ${save}% cheaper</span></button></div>`).join('')}</div>`:''})()}
  ${swaps.length?`<div class="section-title">Better swaps</div><div style="display:grid;gap:8px">${swaps.map(({f,alt})=>`<div class="card"><div class="sub" style="color:var(--muted);font-size:13px">Instead of</div><div style="font-weight:600">${esc(f.p.name)} <span class="chip high" style="margin-left:4px">${f.a.safety}</span></div><div class="sub" style="color:var(--muted);font-size:13px;margin-top:6px">Try</div><button style="font-weight:600;text-align:left" data-a="open" data-id="${alt.p.id}">${esc(alt.p.name)} <span class="chip good" style="margin-left:4px">${alt.a.safety}</span></button><div class="reason">${[...f.a.tags].filter(t=>ALT[t]&&!alt.a.tags.has(t)).slice(0,2).map(t=>ALT[t]).join(' ')}</div></div>`).join('')}</div>`:''}
  ${fail.length?`<div class="section-title">Didn't make the cut</div><div class="card" style="padding:4px 14px">${fail.map(f=>`<div class="toggle"><div style="flex:1"><div style="font-weight:500">${esc(f.p.name)}</div><div style="font-size:12.5px;color:var(--high)">${reasons(f).join(' · ')}</div></div></div>`).join('')}</div>`:''}`;
}

async function shrink(file){
  try{
    const img=await createImageBitmap(file); const k=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.85);
  }catch(e){ return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)}); }
}
const CATS=['Moisturizer','Cleanser','Serum','Toner','Sunscreen','Foundation','Concealer','Powder','Blush','Bronzer','Highlighter','Lipstick','Lip gloss','Mascara','Eyeliner','Eyeshadow','Brow','Primer','Setting spray','Nail polish','Hair','Body','Fragrance','Other'];
const normKey=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const STOP=new Set(['the','and','for','with','de','la','le','of','ml','g','oz','new','by']);
const toks=s=>new Set(normKey(s).split(' ').filter(w=>w.length>1&&!STOP.has(w)));
function nameSim(a,b){const A=toks(a),B=toks(b);if(!A.size||!B.size)return 0;let i=0;A.forEach(w=>{if(B.has(w))i++});return i/Math.min(A.size,B.size);}
function findSame(d){
  const n=normKey(d.name),b=normKey(d.brand); if(!n) return null;
  const mine=S.products.filter(p=>!p.demo);
  const exact=mine.find(p=>normKey(p.name)===n&&(!b||!p.brand||normKey(p.brand)===b)); if(exact) return exact;
  const brandOk=p=>!b||!p.brand||normKey(p.brand)===b||normKey(p.brand).includes(b)||b.includes(normKey(p.brand));
  const scored=mine.filter(brandOk).map(p=>({p,s:nameSim(p.name+' '+(p.brand||''),d.name+' '+(d.brand||''))})).filter(x=>x.s>=0.8).sort((x,y)=>y.s-x.s);
  return scored.length&&(scored.length===1||scored[0].s>scored[1].s)?scored[0].p:null;
}

function fillProduct(id,list){
  const p=S.products.find(x=>x.id===id); if(!p) return;
  const best=list.find(x=>String(x.ingredients||'').length>10)||list[0]; if(!best) return;
  const tv=v=>['yes','no','unknown'].includes(v)?v:'unknown';
  if(best.ingredients&&String(best.ingredients).length>10) p.ing=String(best.ingredients);
  const n=v=>{const x=parseFloat(v);return isFinite(x)&&x>0?x:null};
  if(!p.size&&n(best.size)){p.size=n(best.size);if(['ml','g','oz'].includes(best.unit))p.unit=best.unit;}
  if(!p.price&&n(best.price)){p.price=n(best.price);if(/^[A-Za-z]{3}$/.test(best.currency||''))p.cur=best.currency.toUpperCase();}
  for(const [k,src] of [['cf','cruelty_free'],['vegan','vegan'],['plastic','plastic_free_packaging'],['refill','refillable']]) if((p[k]||'unknown')==='unknown'&&tv(best[src])!=='unknown') p[k]=tv(best[src]);
  const rv=best.reviews&&typeof best.reviews==='object'?best.reviews:null;
  if(rv&&typeof rv.sentiment==='number'){p.reviews=p.reviews||[];p.reviews.push({at:Date.now(),rating:n(best.rating)&&best.rating<=5?+best.rating:null,count:n(best.review_count)||0,read:parseInt(rv.read)||0,sentiment:Math.max(0,Math.min(100,rv.sentiment)),pros:(rv.pros||[]).slice(0,4).map(String),cons:(rv.cons||[]).slice(0,4).map(String),skin:(rv.skin||[]).slice(0,3).map(String)});}
  Object.assign(p,cleanProduct(p)); save(); render(); productSheet(id,true);
  toast(p.ing?'Ingredients added':'No ingredients found in that image');
}
function ingest(list){
  const tv=v=>['yes','no','unknown'].includes(v)?v:'unknown';
  const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?n:null};
  const added=[],updated=[];
  S.compare=S.compare.filter(cid=>{const q=S.products.find(p=>p.id===cid);return q&&!q.demo});
  for(const x of list){
    const rv=x.reviews&&typeof x.reviews==='object'?x.reviews:null;
    const batch=(num(x.rating)||(rv&&typeof rv.sentiment==='number'))?{at:Date.now(),rating:num(x.rating)&&x.rating<=5?+x.rating:null,count:num(x.review_count)||0,
      read:rv?(parseInt(rv.read)||0):0,sentiment:rv&&typeof rv.sentiment==='number'?Math.max(0,Math.min(100,rv.sentiment)):(num(x.rating)?x.rating/5*100:null),
      pros:rv&&Array.isArray(rv.pros)?rv.pros.slice(0,4).map(String):[],cons:rv&&Array.isArray(rv.cons)?rv.cons.slice(0,4).map(String):[],skin:rv&&Array.isArray(rv.skin)?rv.skin.slice(0,3).map(String):[]}:null;
    const fields={name:String(x.name||'Scanned product').trim(),brand:String(x.brand||'').trim(),category:CATS.includes(x.category)?x.category:'Other',
      size:num(x.size),unit:['ml','g','oz'].includes(x.unit)?x.unit:'ml',price:num(x.price),cur:/^[A-Za-z]{3}$/.test(String(x.currency||'').trim())?String(x.currency).trim().toUpperCase():S.currency,ing:String(x.ingredients||''),
      cf:tv(x.cruelty_free),vegan:tv(x.vegan),plastic:tv(x.plastic_free_packaging),refill:tv(x.refillable),url:/^https?:\/\//.test(x.url||'')?x.url:''};
    let note=x.unreadable?('Note: '+x.unreadable):'';
    const same=findSame(fields);
    if(same){
      for(const k of ['brand','category','size','unit','ing','url']) if(!same[k]&&fields[k]) same[k]=fields[k];
      if(fields.price){same.price=fields.price;same.cur=fields.cur;}
      for(const k of ['cf','vegan','plastic','refill']) if((same[k]||'unknown')==='unknown'&&fields[k]!=='unknown') same[k]=fields[k];
      if(batch&&batch.sentiment!=null){same.reviews=same.reviews||[];same.reviews.push(batch);}
      updated.push(same);
    }else{
      const rec=cleanProduct({id:uid(),...fields,notes:note,scanned:true,reviews:batch&&batch.sentiment!=null?[batch]:[]});
      S.products.unshift(rec); added.push(rec);
    }
  }
  for(const p of [...added,...updated]){ if(!S.compare.includes(p.id)){ if(S.compare.length>=4) S.compare.shift(); S.compare.push(p.id);} }
  save(); render();
  const all=[...added,...updated];
  if(all.length===1) return productSheet(all[0].id,true);
  sh.innerHTML=`<div class="grab"></div><h2>Found ${all.length} products</h2>
    <p class="lede">${added.length} added${updated.length?`, ${updated.length} already on your shelf and updated`:''}. Tap one to see its details.</p>
    <div style="display:grid;gap:8px">${all.map(p=>{const f=full(p);return `<button class="card pcard" data-a="open" data-id="${p.id}"><span class="meta"><span class="name" translate="no" style="display:block">${esc(p.name)}</span><span class="sub" style="display:block">${esc(p.brand||'')} · ${priceLabel(p)}</span>${!p.ing?'<span class="reason" style="display:block">No ingredients found yet. Open its own page or scan the back of the box.</span>':''}</span>${ring(f.a.safety,46)}</button>`}).join('')}</div>
    <div class="row" style="margin-top:14px">${AI?'<label class="btn small" style="cursor:pointer"><input type="file" class="scanfile" accept="image/*" multiple hidden>📷 Scan more</label>':''}<span class="spacer"></span><button class="btn small primary" data-a="gocmp">Compare →</button></div>`;
}

const b64u={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},

async function packShare(products){

async function unpackShare(t){

  openSheet(`<div class="row"><h2 style="flex:1">Share ${kind==='all'?'my shelf':list.length>1?'comparison':'product'}</h2><button class="iconbtn" data-a="close">✕</button></div>
  <p class="lede">${kind==='all'?`All ${list.length} product${list.length===1?'':'s'} on your shelf`:list.map(p=>esc(p.name)).join(' · ')}</p>
  <div style="display:grid;gap:8px">
    <button class="card pcard" data-a="sh-link" data-k="${kind}" data-id="${id||''}"><span style="font-size:22px">🔗</span><span class="meta"><span class="name" translate="no" style="display:block">Send a link</span><span class="sub" style="display:block">Opens these results on any phone. They can add them to their own shelf.</span></span></button>
    <button class="card pcard" data-a="sh-img" data-k="${kind}" data-id="${id||''}"><span style="font-size:22px">🖼️</span><span class="meta"><span class="name" translate="no" style="display:block">Share as image</span><span class="sub" style="display:block">A picture of the scores for WhatsApp, Instagram or your photos.</span></span></button>
    ${kind==='cmp'?`<button class="card pcard" data-a="sh-pdf"><span style="font-size:22px">📄</span><span class="meta"><span class="name" translate="no" style="display:block">Save as PDF / print</span><span class="sub" style="display:block">Keep the full comparison table as a file.</span></span></button>`:''}
    <button class="card pcard" data-a="sh-text" data-k="${kind}" data-id="${id||''}"><span style="font-size:22px">💬</span><span class="meta"><span class="name" translate="no" style="display:block">Share as text</span><span class="sub" style="display:block">A short summary you can paste anywhere.</span></span></button>
  </div>`);
}
async function shareOrCopy(title,text,url){
  try{ if(navigator.share){ await navigator.share({title,text,url}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url?text+'\n'+url:text); toast('Link copied, ready to paste'); }catch(e){ prompt('Copy this link',url||text); }
}
function saveFile(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
async function shareFile(blob,name,title){
  const file=new File([blob],name,{type:blob.type});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  saveFile(blob,name); toast('Saved to your downloads');
}
/* Image card drawn on a canvas */
function wrapText(ctx,text,maxW){const words=String(text).split(' ');const lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines}
async function shareImage(list){
  const more=Math.max(0,list.length-12); const fs=list.slice(0,12).map(full); const W=1080,pad=64,rowH=250;
  const nV=fs.length>1?(2+(fs.some(f=>f.r)?1:0)+(fs.some(f=>f.v)?1:0)):0;
  const H=180+60+fs.length*rowH+(nV?70+nV*42:0)+90+(more?50:0);
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#faf6f2'; x.fillRect(0,0,W,H);
  x.fillStyle='#a8475e'; x.fillRect(0,0,W,180);
  x.fillStyle='#fff'; x.font='700 60px Georgia, serif'; x.fillText('Shelf Check',pad,100);
  x.font='400 30px system-ui, sans-serif'; x.fillText(tr(list.length>4?`My shelf · ${list.length} products`:fs.length>1?`Comparing ${fs.length} products`:'Product check'),pad,148);
  const col=s=>s==null?'#8a8a8a':s>=80?'#2a7454':s>=60?'#5f8f3a':s>=40?'#a86a08':'#b83227';
  let y=180+60+50;
  const plain=p=>{if(!(p.price>0))return '';const v=priceOf(p);return v!=null?`${S.currency} ${fmtNum(v)}`:`${p.cur||S.currency} ${fmtNum(p.price)}`};
  fs.forEach((f,i)=>{
    x.fillStyle='#fff'; x.strokeStyle='#ece2da'; x.lineWidth=2; x.beginPath(); x.roundRect(pad-16,y-50,W-2*pad+32,rowH-24,28); x.fill(); x.stroke();
    x.fillStyle='#2b2320'; x.font='700 38px system-ui, sans-serif';
    const nl=wrapText(x,f.p.name,W-2*pad-20).slice(0,1); x.fillText(nl[0]+(wrapText(x,f.p.name,W-2*pad-20).length>1?'…':''),pad+8,y+6);
    x.fillStyle='#7d706a'; x.font='400 27px system-ui, sans-serif';
    x.fillText([f.p.brand,plain(f.p),f.v?`${S.currency} ${fmtNum(f.v)}/10${f.p.unit}`:''].filter(Boolean).join('  ·  '),pad+8,y+48);
    const pills=[['Safety',f.a.safety],['Ethics',f.e.score],['Reviews',f.r?f.r.score:null]];
    pills.forEach(([lab,v],k)=>{const px=pad+8+k*300,py=y+82;
      x.fillStyle=col(v); x.beginPath(); x.arc(px+40,py+40,40,0,Math.PI*2); x.fill();
      x.fillStyle='#fff'; x.font='700 32px system-ui, sans-serif'; x.textAlign='center'; x.fillText(v==null?'—':String(v),px+40,py+51); x.textAlign='left';
      x.fillStyle='#2b2320'; x.font='600 28px system-ui, sans-serif'; x.fillText(tr(lab),px+96,py+50);});
    y+=rowH;
  });
  if(more){ x.fillStyle='#7d706a'; x.font='600 28px system-ui, sans-serif'; x.fillText(tr(`+ ${more} more on the shared link`),pad,y-10); y+=50; }
  if(fs.length>1){
    const best=(fn)=>fs.reduce((a,b)=>(fn(b)??-1)>(fn(a)??-1)?b:a);
    const lines=[['Safest',best(f=>f.a.safety).p.name],['Most ethical',best(f=>f.e.score).p.name]];
    const rv=fs.filter(f=>f.r); if(rv.length) lines.push(['Best reviewed',best(f=>f.r?f.r.score:null).p.name]);
    const cheap=fs.filter(f=>f.v).sort((a,b)=>a.v-b.v)[0]; if(cheap) lines.push(['Best value',cheap.p.name]);
    y+=10; x.fillStyle='#2b2320'; x.font='700 34px Georgia, serif'; x.fillText(tr('Verdict'),pad,y-6);
    lines.forEach(([k,v],i)=>{x.font='600 28px system-ui, sans-serif';x.fillStyle='#a8475e';x.fillText(tr(k),pad,y+42+i*42);x.fillStyle='#2b2320';x.font='400 28px system-ui, sans-serif';x.fillText(v.length>42?v.slice(0,40)+'…':v,pad+230,y+42+i*42)});
  }
  x.fillStyle='#7d706a'; x.font='400 24px system-ui, sans-serif'; x.fillText(tr('Check your own products at '+location.host),pad,H-50);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  await shareFile(blob,'shelf-check-comparison.png','Shelf Check');
}

function addShared(){

  list.forEach(p=>{const same=findSame(p); if(same){ids.push(same.id);return} const rec={...p,id:uid()}; S.products.unshift(rec); ids.push(rec.id);});

/* Backup files */
function backupData(){ return JSON.stringify({app:'shelf-check',v:1,saved:new Date().toISOString(),currency:S.currency,products:S.products},null,1); }
function importBackup(text){
  const d=JSON.parse(text); if(!Array.isArray(d.products)) throw 0;

/* ============ LANGUAGE (English / Arabic) ============ */
let LANG='en', LOW=null;
function wantLang(){ return S.lang==='en'||S.lang==='ar'? S.lang : ((navigator.languages||[navigator.language||'']).some(l=>String(l).toLowerCase().startsWith('ar'))?'ar':'en'); }
function tr(t){ if(LANG!=='ar'||!window.AR||!t) return t; return trCore(String(t))||t; }
const PREFIX=/^((?:✓|⚠|💡|📷|⬇️|⬆️|🔗|🖼️|📄|💬|🛡️|🌿|💸|🧴|★|•|·|:)\s*)([\s\S]+)$/u;
function trExact(t){ if(!window.AR) return null; const D=AR.dict; if(D[t]!=null) return D[t]; if(!LOW){LOW=new Map();for(const k in D)LOW.set(k.toLowerCase(),D[k]);} return LOW.get(String(t).toLowerCase())||null; }
function trCore(t,noSent){
  const D=AR.dict; if(D[t]!=null) return D[t];
  if(!LOW){LOW=new Map();for(const k in D)LOW.set(k.toLowerCase(),D[k]);}
  const lo=LOW.get(t.toLowerCase()); if(lo) return lo;
  for(const [re,fn] of AR.rules){const m=t.match(re); if(m){const r=fn(m); if(r!=null) return r;}}
  let m=t.match(PREFIX); if(m){const r=trCore(m[2]); if(r) return m[1]+r;}
  m=t.match(/^([\s\S]+?)(\s*[✕↗→])$/); if(m){const r=trCore(m[1]); if(r) return r+m[2];}
  m=t.match(/^([^:]+?)(\s*:)$/); if(m){const r=trCore(m[1],true); if(r) return r+m[2];}
  for(const sep of [' · ',' + ']){ if(t.includes(sep)){const parts=t.split(sep);const out=parts.map(x=>x.trim()?trCore(x.trim())||x:x);if(out.some((x,i)=>x!==parts[i]))return out.join(sep);} }
  if(t.includes(', ')&&t.length<240){const parts=t.split(', ');const out=parts.map(x=>trCore(x,true));if(out.some(Boolean))return out.map((x,i)=>x||parts[i]).join('، ');}
  if(!noSent){
    const sents=(t.match(/[^.!?]+[.!?]+(?:\s+|$)|[^.!?]+$/g)||[]).map(x=>x.trim()).filter(Boolean);
    if(sents.length>1){const out=[];let i=0,ok=false;
      while(i<sents.length){let hit=null,j;for(j=sents.length;j>i;j--){const r=trCore(sents.slice(i,j).join(' '),true);if(r){hit=r;break;}}
        if(hit){out.push(hit);ok=true;i=j;}else{out.push(sents[i]);i++;}}
      if(ok) return out.join(' ');}
  }
  return null;
}
function trNode(node){
  if(LANG!=='ar'||!window.AR) return;
  const skip=el=>el&&el.closest&&el.closest('[translate="no"],script,style,textarea,code');
  const doText=n=>{ if(skip(n.parentElement)) return; const raw=n.nodeValue; if(!/[A-Za-z]/.test(raw)) return;
    const m=raw.match(/^(\s*)([\s\S]*?)(\s*)$/); const out=trCore(m[2]); if(out&&out!==m[2]) n.nodeValue=m[1]+out+m[3]; };
  if(node.nodeType===3){ doText(node); return; }
  if(node.nodeType!==1) return;
  if(!skip(node)){ const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT); let n; const list=[]; while(n=w.nextNode()) list.push(n); list.forEach(doText); }
  const els=[node,...node.querySelectorAll('[placeholder],[aria-label],[title]')];
  els.forEach(el=>{ if(!el.getAttribute||(el.closest&&el.closest('[translate="no"]'))) return; ['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a); if(v&&/[A-Za-z]/.test(v)){const o=trCore(v); if(o) el.setAttribute(a,o);}}); });
}
const i18nObs=new MutationObserver(ms=>{ for(const m of ms) m.addedNodes.forEach(trNode); });
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function startLang(){
  LANG=wantLang();
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  if(LANG==='ar'){
    try{
      if(!window.AR) await loadScript('/i18n-ar.js');
      const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap'; document.head.appendChild(l);
      document.title='Shelf Check — قارن منتجات التجميل';
      trNode(document.body); i18nObs.observe(document.body,{childList:true,subtree:true});
    }catch(e){ LANG='en'; document.documentElement.dir='ltr'; document.documentElement.lang='en'; }
  }
  document.documentElement.classList.remove('i18n-wait');
}

/* ============ NIGHT MODE ============ */
const darkMQ=matchMedia('(prefers-color-scheme: dark)');
function isDark(){return S.theme==='dark'||(S.theme==='auto'&&darkMQ.matches)}
function applyTheme(){
  const d=isDark(); document.documentElement.dataset.theme=d?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=d?'#151214':'#a8475e';
  const b=document.getElementById('themebtn');
  if(b) b.innerHTML=d?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
}
darkMQ.addEventListener?.('change',()=>{if(S.theme==='auto')applyTheme()});

/* ============ EVENTS ============ */
let wipeArmed=false;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],[data-tab]'); if(!t)return;
  if(t.dataset.tab) return go(t.dataset.tab);
  const a=t.dataset.a,id=t.dataset.id;
  switch(a){
    case 'add':formSheet();break;
    case 'open':productSheet(id);break;
    case 'edit':formSheet(id);break;
    case 'close':closeSheet();break;
    case 'ing':ingSheet(t.dataset.n);break;
    case 'sel':{const i=S.compare.indexOf(id);if(i>-1)S.compare.splice(i,1);else{if(S.compare.length>=4){toast('Compare up to 4 at a time');break}S.compare.push(id)}save();render();if(ov.classList.contains('on')&&sh.querySelector('[data-a="del"]'))productSheet(id);break}
    case 'clearsel':S.compare=[];save();render();break;
    case 'go':go(t.dataset.t);break;
    case 'gocmp':closeSheet();go('compare');break;
    case 'sharecmp':shareSheet('cmp');break;
    case 'shareall':shareSheet('all');break;
    case 'shareprod':shareSheet('one',id);break;
    case 'sh-link':{const k=t.dataset.k,list=listFor(k,t.dataset.id);shareLink(list).then(u=>shareOrCopy('Shelf Check',tr(k==='all'?`My beauty shelf on Shelf Check (${list.length} products)`:list.length>1?'Compare these products on Shelf Check':'Check this product on Shelf Check'),u));break}
    case 'sh-img':{const list=listFor(t.dataset.k,t.dataset.id);toast('Making the image…');shareImage(list).catch(()=>toast("Couldn't make the image"));break}
    case 'sh-pdf':closeSheet();go('compare');setTimeout(()=>window.print(),300);break;
    case 'sh-text':{const k=t.dataset.k;shareText('Shelf Check',k==='one'?productSummary(S.products.find(x=>x.id===t.dataset.id)):listSummary(listFor(k),tr(k==='all'?'My Shelf Check list':'Shelf Check comparison')));break}
    case 'sh-addall':addShared();break;
    case 'bk-download':saveFile(new Blob([backupData()],{type:'application/json'}),`shelf-check-backup-${new Date().toISOString().slice(0,10)}.json`);toast('Backup saved to your downloads');break;
    case 'bk-share':shareFile(new Blob([backupData()],{type:'application/json'}),`shelf-check-backup-${new Date().toISOString().slice(0,10)}.json`,'Shelf Check backup');break;
    case 'star':{const p=S.products.find(x=>x.id===id);if(p){p.myRating=(p.myRating===+t.dataset.v)?0:+t.dataset.v;save();render();productSheet(id)}break}
    case 'sf':shelfFilter=t.dataset.c;render();break;
    case 'del':S.products=S.products.filter(p=>p.id!==id);S.compare=S.compare.filter(x=>x!==id);save();closeSheet();render();toast('Deleted');break;
    case 'cleardemo':{const ids=S.products.filter(p=>p.demo).map(p=>p.id);S.products=S.products.filter(p=>!p.demo);S.compare=S.compare.filter(x=>!ids.includes(x));save();render();toast('Demo products removed');break}
    case 'loaddemo':S.products=[...S.products.filter(p=>!p.demo),...demo.map(p=>({...p,cur:'AED',id:uid(),demo:true}))];save();render();toast('Demo products added');break;
    case 'wipe':if(!wipeArmed){wipeArmed=true;t.textContent='Tap again to confirm';setTimeout(()=>{wipeArmed=false;t.textContent='Delete everything'},3000);break}S.products=[];S.compare=[];save();closeSheet();render();toast('Everything deleted');break;
    case 'export':document.getElementById('bk').value=JSON.stringify({v:1,currency:S.currency,products:S.products});break;
    case 'copybk':{const v=document.getElementById('bk');if(!v.value)v.value=JSON.stringify({v:1,currency:S.currency,products:S.products});navigator.clipboard?.writeText(v.value).then(()=>toast('Copied'),()=>{v.select();toast('Select all and copy')});break}
    case 'import':try{const d=JSON.parse(document.getElementById('bk').value);if(!Array.isArray(d.products))throw 0;const have=new Set(S.products.map(p=>p.id));cleanList(d.products).forEach(p=>{if(have.has(p.id))p.id=uid();S.products.push(p)});if(/^[A-Z]{3}$/.test(d.currency||''))S.currency=d.currency;save();closeSheet();render();toast(`Imported ${d.products.length} products`)}catch(err){toast("That backup couldn't be read")}break;
    case 'settings':settingsSheet();break;
    case 'profile':profileSheet();break;
    case 'skintype':S.skin={...(S.skin||{}),type:t.dataset.k};_an.clear();save();render();profileSheet();break;
    case 'skintog':S.skin={...(S.skin||{}),[t.dataset.k]:!(S.skin||{})[t.dataset.k]};save();render();profileSheet();break;
    case 'avoidtog':{const k=t.dataset.k;S.avoid=S.avoid||[];S.avoid=S.avoid.includes(k)?S.avoid.filter(x=>x!==k):[...S.avoid,k];save();render();profileSheet();break}
    case 'langset':S.lang=t.dataset.k;save();location.reload();break;
    case 'theme':S.theme=isDark()?'light':'dark';save();applyTheme();break;
    case 'themeset':S.theme=t.dataset.k;save();applyTheme();settingsSheet();break;
    case 'scanclear':scanText='';renderScan();break;
    case 'scansave':formSheet(null,scanText);break;
    case 'pref':S.prefs[t.dataset.k]=t.dataset.k==='noavoid'?S.prefs.noavoid===false:!S.prefs[t.dataset.k];save();renderSuggest();break;
    case 'mode':S.prefs.mode=t.dataset.k;save();renderSuggest();break;
  }
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a==='prefsel'){S.prefs[t.dataset.k]=t.value;save();renderSuggest()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function go(t){tab=t;try{if(location.hash!=='#'+t)history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+tab));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ({shelf:renderShelf,compare:renderCompare,scan:renderScan,suggest:renderSuggest})[tab]();
}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#s=')){const c=location.hash.slice(3);history.replaceState(null,'',location.pathname+'#'+tab);openShared(c);return}const h=location.hash.slice(1);if(['shelf','compare','scan','suggest'].includes(h)&&h!==tab){tab=h;render()}});
load();
applyTheme();
startLang();
{const h=location.hash.slice(1);if(h.startsWith('s=')){const c=h.slice(2);history.replaceState(null,'',location.pathname);setTimeout(()=>openShared(c),200);}else if(['shelf','compare','scan','suggest'].includes(h))tab=h;}
render();
